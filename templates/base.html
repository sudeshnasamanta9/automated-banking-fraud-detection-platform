<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detecta</title>
    
    <!-- Load Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Link to your external nav.css (Ensure this file exists in your static folder) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='nav.css') }}">
</head>
<body>

    <nav class="sidebar">
        <div class="logo">Detecta</div>
        
        <a href="/dashboard" class="nav-link {% if request.path == '/dashboard' %}active{% endif %}">
            <i data-lucide="layout-dashboard"></i> Dashboard
        </a>
       <a href="/configuration" class="nav-link {% if request.path == '/configuration' %}active{% endif %}">
                <i data-lucide="settings"></i> Configuration
            </a>
        <a href="/rules" class="nav-link {% if request.path == '/rules' %}active{% endif %}">
            <i data-lucide="shield-check"></i> Rule Management
        </a>
        <a href="/report" class="nav-link {% if request.path == '/report' %}active{% endif %}">
            <i data-lucide="file-text"></i> Report
        </a>
        <div class="logout-area">
            <form action="/logout" method="POST">
                <button type="submit" class="btn-logout">
                    <i data-lucide="log-out"></i> Logout
                </button>
            </form>
        </div>
    </nav>

    <main class="content">
        {% block content %}{% endblock %}
    </main>

    <script>
    // Render the Lucide icons on page load
    lucide.createIcons();

    // Background engine status poller
    setInterval(async () => {
        try {
            let response = await fetch('/check-engine-status');
            let data = await response.json();
            if (data.completed) {
                let existingBanner = document.getElementById('engineNotification');
                if (existingBanner) {
                    existingBanner.remove();
                }

                let banner = document.createElement('div');
                banner.id = 'engineNotification';
                banner.style.cssText = "position: fixed; top: 40px; right: 40px; background: #151c2c; color: #34d399; border: 1px solid #10b981; padding: 15px 25px; border-radius: 8px; font-weight: 600; font-size: 14px; z-index: 99999; box-shadow: 0 4px 20px rgba(0,0,0,0.7); font-family: 'Inter', sans-serif;";
                banner.innerText = data.message;
                document.body.appendChild(banner);
            }
        } catch (e) {
            console.error("Error checking engine status:", e);
        }
    }, 5000);
</script>
</body>
</html>
