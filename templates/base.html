<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENGINE_CORE</title>
    
    <!-- Load Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Link to your external nav.css (Ensure this file exists in your static folder) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='nav.css') }}">
</head>
<body>

    <nav class="sidebar">
        <div class="logo">ENGINE_CORE</div>
        
        <a href="/dashboard" class="nav-link {% if request.path == '/dashboard' %}active{% endif %}">
            <i data-lucide="layout-dashboard"></i> Dashboard
        </a>
       <a href="/configuration" class="nav-link {% if request.path == '/configuration' %}active{% endif %}">
                <i data-lucide="settings"></i> Configuration
            </a>
        <a href="/rules" class="nav-link {% if request.path == '/rules' %}active{% endif %}">
            <i data-lucide="shield-check"></i> Rule Management
        </a>
        <a href="/report" class="nav-link {% if request.path == '/report' %}active{% endif %}">
            <i data-lucide="file-text"></i> Report
        </a>
        <div class="logout-area">
            <form action="/logout" method="POST">
                <button type="submit" class="btn-logout">
                    <i data-lucide="log-out"></i> Logout
                </button>
            </form>
        </div>
    </nav>

    <main class="content">
        {% block content %}{% endblock %}
    </main>

    <!-- Initialize icons -->
    <script>lucide.createIcons();</script>
</body>
</html>
